name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch: fixes. minor: new moves or options. major: anything that breaks existing use."
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency: release

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump the version, tag and publish
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=plugins/twen/.claude-plugin/plugin.json
          IFS=. read -r major minor patch < <(jq -r .version "$manifest")
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          updated="$(jq --arg version "$version" '.version = $version' "$manifest")"
          printf '%s\n' "$updated" > "$manifest"

          tag="twen-v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore(release): twen $version"
          git tag --annotate "$tag" --message "Twen $version"
          git push --atomic origin HEAD:main "$tag"
          gh release create "$tag" --title "Twen $version" --generate-notes --verify-tag
